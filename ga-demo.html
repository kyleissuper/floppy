<script>
// ====== NEURAL NETWORK ======
class NeuralNet {
  constructor(weights) {
    // 5 inputs -> 6 hidden -> 1 output
    // weights: 5*6 + 6 bias + 6*1 + 1 bias = 43
    this.inputSize = 5;
    this.hiddenSize = 6;
    this.totalWeights = this.inputSize * this.hiddenSize + this.hiddenSize + this.hiddenSize + 1;
    if (weights) {
      this.weights = weights.slice();
    } else {
      this.weights = [];
      for (let i = 0; i < this.totalWeights; i++) {
        this.weights.push(Math.random() * 2 - 1);
      }
    }
  }

  predict(inputs) {
    let idx = 0;
    // Hidden layer
    const hidden = [];
    for (let h = 0; h < this.hiddenSize; h++) {
      let sum = 0;
      for (let i = 0; i < this.inputSize; i++) {
        sum += inputs[i] * this.weights[idx++];
      }
      sum += this.weights[idx++]; // bias
      hidden.push(Math.max(0, sum)); // ReLU
    }
    // Output layer
    let out = 0;
    for (let h = 0; h < this.hiddenSize; h++) {
      out += hidden[h] * this.weights[idx++];
    }
    out += this.weights[idx++]; // bias
    return 1 / (1 + Math.exp(-out)); // sigmoid
  }

  copy() {
    return new NeuralNet(this.weights);
  }
}

// ====== GENETIC ALGORITHM ======
class GeneticAlgorithm {
  constructor(popSize) {
    this.popSize = popSize;
    this.mutationRate = 0.15;
    this.mutationStrength = 0.5;
  }

  crossover(parentA, parentB) {
    const child = new NeuralNet();
    for (let i = 0; i < child.weights.length; i++) {
      child.weights[i] = Math.random() < 0.5 ? parentA.weights[i] : parentB.weights[i];
    }
    return child;
  }

  mutate(net) {
    for (let i = 0; i < net.weights.length; i++) {
      if (Math.random() < this.mutationRate) {
        net.weights[i] += (Math.random() * 2 - 1) * this.mutationStrength;
      }
    }
    return net;
  }

  select(population, fitnesses) {
    // Tournament selection (size 5)
    const tournamentSize = 5;
    let bestIdx = Math.floor(Math.random() * population.length);
    for (let i = 1; i < tournamentSize; i++) {
      const idx = Math.floor(Math.random() * population.length);
      if (fitnesses[idx] > fitnesses[bestIdx]) bestIdx = idx;
    }
    return population[bestIdx];
  }

  evolve(population, fitnesses) {
    const newPop = [];
    // Elitism: keep top 2
    const sorted = fitnesses.map((f, i) => ({ f, i })).sort((a, b) => b.f - a.f);
    newPop.push(population[sorted[0].i].copy());
    newPop.push(population[sorted[1].i].copy());

    while (newPop.length < this.popSize) {
      const parentA = this.select(population, fitnesses);
      const parentB = this.select(population, fitnesses);
      let child = this.crossover(parentA, parentB);
      child = this.mutate(child);
      newPop.push(child);
    }
    return newPop;
  }
}

// ====== GAME SIMULATION ======
const CANVAS_W = 400, CANVAS_H = 600;
const KITTY_RADIUS = 30;
const KITTY_X = 90;
const SCROLL_SPEED = -5;
const FALL_GRAVITY = 1.3;
const JUMP_SPEED = -17;
const OBS_WIDTH = 70;
const OBS_HEIGHT = 600;
const OBS_X_GAP = 220;
const OBS_Y_GAP = 260;
const MAX_PAIRS = 3;

class Cat {
  constructor(brain) {
    this.brain = brain;
    this.reset();
  }

  reset() {
    this.y = 230;
    this.fallSpeed = JUMP_SPEED;
    this.alive = true;
    this.fitness = 0;
    this.rotation = 0;
    this.animFrame = 60;
    this.spriteNum = 3;
  }

  jump() {
    this.fallSpeed = JUMP_SPEED;
    this.rotation = 0;
    this.animFrame = 0;
  }

  update() {
    if (!this.alive) return;
    this.fallSpeed += FALL_GRAVITY;
    this.y += this.fallSpeed;
    this.rotation = Math.min(150, this.rotation + 3.5);
    this.fitness += 1;

    // Sprite animation
    this.animFrame++;
    if (this.animFrame < 5) this.spriteNum = 0;
    else if (this.animFrame < 13) this.spriteNum = 1;
    else if (this.animFrame < 17) this.spriteNum = 2;
    else this.spriteNum = 3;

    // Boundaries
    if (this.y - KITTY_RADIUS < 0 || this.y + KITTY_RADIUS > CANVAS_H) {
      this.alive = false;
    }
  }

  checkCollision(obstacles) {
    if (!this.alive) return;
    for (const box of obstacles) {
      const distX = Math.abs(KITTY_X - box.posX - box.width / 2);
      const distY = Math.abs(this.y - box.posY - box.height / 2);
      if (distX > box.width / 2 + KITTY_RADIUS || distY > box.height / 2 + KITTY_RADIUS) continue;
      if (distX <= box.width / 2 || distY <= box.height / 2) { this.alive = false; return; }
      const dx = distX - box.width / 2;
      const dy = distY - box.height / 2;
      if (dx * dx + dy * dy <= KITTY_RADIUS * KITTY_RADIUS) { this.alive = false; return; }
    }
  }

  decide(obstacles) {
    if (!this.alive) return;
    // Find next obstacle pair ahead of cat
    let nextTop = null, nextBot = null;
    for (let i = 0; i < obstacles.length; i += 2) {
      if (obstacles[i].posX + OBS_WIDTH > KITTY_X - KITTY_RADIUS) {
        nextTop = obstacles[i];
        nextBot = obstacles[i + 1];
        break;
      }
    }
    if (!nextTop) return;

    const gapCenterY = nextTop.posY + nextTop.height + OBS_Y_GAP / 2;
    const inputs = [
      this.y / CANVAS_H,                          // cat y normalized
      this.fallSpeed / 20,                         // velocity normalized
      (nextTop.posX - KITTY_X) / CANVAS_W,        // horizontal distance
      gapCenterY / CANVAS_H,                      // gap center y normalized
      (this.y - gapCenterY) / CANVAS_H,           // offset from gap center
    ];

    const output = this.brain.predict(inputs);
    if (output > 0.5) {
      this.jump();
    }
  }
}

class ObstacleManager {
  constructor() { this.reset(); }

  reset() {
    this.obstacles = [];
    this.addPairAt(600);
    while (this.obstacles.length < MAX_PAIRS * 2) {
      const lastX = this.obstacles[this.obstacles.length - 1].posX;
      this.addPairAt(lastX + OBS_WIDTH + OBS_X_GAP);
    }
    this.score = 0;
    this.lastScoredX = -1;
  }

  addPairAt(posX) {
    const posY = -OBS_HEIGHT + Math.random() * (OBS_HEIGHT - OBS_Y_GAP);
    this.obstacles.push(
      { posX, posY, width: OBS_WIDTH, height: OBS_HEIGHT },
      { posX, posY: posY + OBS_HEIGHT + OBS_Y_GAP, width: OBS_WIDTH, height: OBS_HEIGHT }
    );
  }

  update() {
    for (const o of this.obstacles) o.posX += SCROLL_SPEED;
    while (this.obstacles[0].posX + OBS_WIDTH < 0) {
      const lastX = this.obstacles[this.obstacles.length - 1].posX;
      this.addPairAt(lastX + OBS_WIDTH + OBS_X_GAP);
      this.obstacles.splice(0, 2);
    }
    // Score: count pipes passed
    for (let i = 0; i < this.obstacles.length; i += 2) {
      if (this.obstacles[i].posX + OBS_WIDTH < KITTY_X && this.obstacles[i].posX !== this.lastScoredX) {
        this.score++;
        this.lastScoredX = this.obstacles[i].posX;
      }
    }
  }
}

// ====== MAIN APP ======
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const netCanvas = document.getElementById('networkCanvas');
const netCtx = netCanvas.getContext('2d');
const graphCanvas = document.getElementById('graphCanvas');
const graphCtx = graphCanvas.getContext('2d');

// Scale canvases for retina
function scaleCanvas(c, cx, w, h) {
  const dpr = window.devicePixelRatio || 1;
  c.width = w * dpr;
  c.height = h * dpr;
  c.style.width = '100%';
  cx.scale(dpr, dpr);
}
scaleCanvas(canvas, ctx, CANVAS_W, CANVAS_H);
scaleCanvas(netCanvas, netCtx, 380, 120);
scaleCanvas(graphCanvas, graphCtx, 380, 100);

// Load images
const bgImg = new Image(); bgImg.src = 'img/background.svg';
const lampImg = new Image(); lampImg.src = 'img/lamp.svg';
const stoolImg = new Image(); stoolImg.src = 'img/stool.svg';
const kittySprites = [0,1,2,3].map(n => { const img = new Image(); img.src = `img/kitty-${n}.svg`; return img; });

const POP_SIZE = 50;
const ga = new GeneticAlgorithm(POP_SIZE);
let generation = 1;
let allTimeBest = 0;
let bestHistory = []; // {gen, best, avg}
let running = false;
let speed = 1;
let cats = [];
let obsMgr = new ObstacleManager();
let bgOffset = 0;
let frameCount = 0;

function initPopulation() {
  cats = [];
  for (let i = 0; i < POP_SIZE; i++) {
    cats.push(new Cat(new NeuralNet()));
  }
  obsMgr.reset();
  bgOffset = 0;
  frameCount = 0;
}

function nextGeneration() {
  const fitnesses = cats.map(c => c.fitness);
  const bestFitness = Math.max(...fitnesses);
  const avgFitness = fitnesses.reduce((a, b) => a + b, 0) / fitnesses.length;
  if (bestFitness > allTimeBest) allTimeBest = bestFitness;

  bestHistory.push({ gen: generation, best: bestFitness, avg: avgFitness });

  const brains = cats.map(c => c.brain);
  const newBrains = ga.evolve(brains, fitnesses);

  generation++;
  cats = newBrains.map(b => new Cat(b));
  obsMgr.reset();
  bgOffset = 0;
  frameCount = 0;

  updateStats();
  drawGraph();
}

function updateStats() {
  document.getElementById('gen').textContent = generation;
  const aliveCount = cats.filter(c => c.alive).length;
  document.getElementById('alive').textContent = aliveCount;
  document.getElementById('best').textContent = obsMgr.score;
  document.getElementById('alltime').textContent = Math.floor(allTimeBest / 12); // approx pipes
}

function simStep() {
  const anyAlive = cats.some(c => c.alive);
  if (!anyAlive) {
    nextGeneration();
    return;
  }

  obsMgr.update();
  bgOffset = (bgOffset - SCROLL_SPEED) % 2760;
  frameCount++;

  for (const cat of cats) {
    cat.decide(obsMgr.obstacles);
    cat.update();
    cat.checkCollision(obsMgr.obstacles);
  }
}

function render() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // Background
  if (bgImg.complete) {
    const bgW = 2760 * (CANVAS_H / 600);
    ctx.drawImage(bgImg, -bgOffset % bgW, 0, bgW, CANVAS_H);
    ctx.drawImage(bgImg, (-bgOffset % bgW) + bgW, 0, bgW, CANVAS_H);
  }

  // Obstacles
  const obs = obsMgr.obstacles;
  for (let i = 0; i < obs.length; i++) {
    if (i % 2 === 0) {
      if (lampImg.complete) ctx.drawImage(lampImg, obs[i].posX, obs[i].posY + 10, OBS_WIDTH, OBS_HEIGHT);
    } else {
      if (stoolImg.complete) ctx.drawImage(stoolImg, obs[i].posX - 10, obs[i].posY - 5, OBS_WIDTH * 1.3, OBS_HEIGHT * 1.3);
    }
  }

  // Cats
  const toRad = Math.PI / 180;
  const kittyDrawR = KITTY_RADIUS * 1.9;

  // Find best alive cat for highlight
  let bestAliveIdx = -1;
  let bestAliveFitness = -1;
  for (let i = 0; i < cats.length; i++) {
    if (cats[i].alive && cats[i].fitness > bestAliveFitness) {
      bestAliveFitness = cats[i].fitness;
      bestAliveIdx = i;
    }
  }

  for (let i = 0; i < cats.length; i++) {
    const cat = cats[i];
    if (!cat.alive) continue;
    const isBest = i === bestAliveIdx;
    const alpha = isBest ? 1 : 0.25;
    const sprite = kittySprites[cat.spriteNum];
    if (!sprite || !sprite.complete) continue;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(KITTY_X, cat.y);
    ctx.rotate((cat.rotation + 30) * toRad);
    ctx.drawImage(sprite, -kittyDrawR, -kittyDrawR, kittyDrawR * 2, kittyDrawR * 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // Score overlay
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, CANVAS_W, 36);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`Gen ${generation}  |  Alive: ${cats.filter(c => c.alive).length}/${POP_SIZE}  |  Pipes: ${obsMgr.score}`, 10, 24);

  // Draw network viz for best alive cat
  if (bestAliveIdx >= 0) drawNetwork(cats[bestAliveIdx]);
}

function drawNetwork(cat) {
  const w = 380, h = 120;
  netCtx.clearRect(0, 0, w, h);

  const inputLabels = ['Y pos', 'Velocity', 'Dist X', 'Gap Y', 'Offset'];
  const hiddenCount = 6;
  const inputX = 60, hiddenX = 190, outputX = 320;

  // Find next obstacle for inputs
  let nextTop = null;
  for (let i = 0; i < obsMgr.obstacles.length; i += 2) {
    if (obsMgr.obstacles[i].posX + OBS_WIDTH > KITTY_X - KITTY_RADIUS) {
      nextTop = obsMgr.obstacles[i]; break;
    }
  }

  let inputs = [0, 0, 0, 0, 0];
  if (nextTop) {
    const gapCenterY = nextTop.posY + nextTop.height + OBS_Y_GAP / 2;
    inputs = [
      cat.y / CANVAS_H,
      cat.fallSpeed / 20,
      (nextTop.posX - KITTY_X) / CANVAS_W,
      gapCenterY / CANVAS_H,
      (cat.y - gapCenterY) / CANVAS_H,
    ];
  }

  // Compute activations
  const brain = cat.brain;
  let idx = 0;
  const hidden = [];
  for (let h = 0; h < hiddenCount; h++) {
    let sum = 0;
    for (let i = 0; i < 5; i++) sum += inputs[i] * brain.weights[idx++];
    sum += brain.weights[idx++];
    hidden.push(Math.max(0, sum));
  }
  let out = 0;
  for (let hh = 0; hh < hiddenCount; hh++) out += hidden[hh] * brain.weights[idx++];
  out += brain.weights[idx++];
  const output = 1 / (1 + Math.exp(-out));

  const inputYs = inputLabels.map((_, i) => 15 + i * 21);
  const hiddenYs = Array.from({ length: hiddenCount }, (_, i) => 10 + i * 18);
  const outputY = 60;

  // Connections input -> hidden
  for (let i = 0; i < 5; i++) {
    for (let h = 0; h < hiddenCount; h++) {
      const wIdx = i * (hiddenCount + 1) + (h < hiddenCount ? h : 0);
      // Approximate: just use sign
      const ww = brain.weights[i * 7 + h]; // rough index
      netCtx.strokeStyle = ww > 0 ? 'rgba(100,200,100,0.3)' : 'rgba(200,100,100,0.3)';
      netCtx.lineWidth = Math.min(2, Math.abs(ww));
      netCtx.beginPath();
      netCtx.moveTo(inputX + 4, inputYs[i]);
      netCtx.lineTo(hiddenX - 4, hiddenYs[h]);
      netCtx.stroke();
    }
  }

  // Connections hidden -> output
  for (let h = 0; h < hiddenCount; h++) {
    const ww = brain.weights[35 + h];
    netCtx.strokeStyle = ww > 0 ? 'rgba(100,200,100,0.4)' : 'rgba(200,100,100,0.4)';
    netCtx.lineWidth = Math.min(2.5, Math.abs(ww));
    netCtx.beginPath();
    netCtx.moveTo(hiddenX + 4, hiddenYs[h]);
    netCtx.lineTo(outputX - 4, outputY);
    netCtx.stroke();
  }

  // Draw nodes
  // Inputs
  netCtx.font = '9px sans-serif';
  netCtx.textAlign = 'right';
  for (let i = 0; i < 5; i++) {
    const brightness = Math.min(255, Math.floor(Math.abs(inputs[i]) * 255));
    netCtx.fillStyle = `rgb(${brightness}, ${100 + brightness / 2}, ${255 - brightness})`;
    netCtx.beginPath();
    netCtx.arc(inputX, inputYs[i], 4, 0, Math.PI * 2);
    netCtx.fill();
    netCtx.fillStyle = '#888';
    netCtx.fillText(inputLabels[i], inputX - 8, inputYs[i] + 3);
  }

  // Hidden
  for (let h = 0; h < hiddenCount; h++) {
    const val = Math.min(1, hidden[h] / 3);
    const b = Math.floor(val * 255);
    netCtx.fillStyle = `rgb(${b}, ${200}, ${100 + b / 2})`;
    netCtx.beginPath();
    netCtx.arc(hiddenX, hiddenYs[h], 5, 0, Math.PI * 2);
    netCtx.fill();
  }

  // Output
  const outColor = output > 0.5 ? '#e94560' : '#555';
  netCtx.fillStyle = outColor;
  netCtx.beginPath();
  netCtx.arc(outputX, outputY, 7, 0, Math.PI * 2);
  netCtx.fill();
  netCtx.fillStyle = '#aaa';
  netCtx.textAlign = 'left';
  netCtx.font = '10px sans-serif';
  netCtx.fillText(output > 0.5 ? 'JUMP!' : 'wait', outputX + 12, outputY + 4);
  netCtx.fillStyle = '#666';
  netCtx.font = '9px sans-serif';
  netCtx.fillText(output.toFixed(2), outputX + 12, outputY + 16);
}

function drawGraph() {
  const w = 380, h = 100;
  graphCtx.clearRect(0, 0, w, h);

  if (bestHistory.length < 2) return;

  const maxFit = Math.max(...bestHistory.map(b => b.best), 1);
  const padL = 5, padR = 5, padT = 10, padB = 15;
  const gw = w - padL - padR;
  const gh = h - padT - padB;

  // Best fitness line
  graphCtx.strokeStyle = '#e94560';
  graphCtx.lineWidth = 2;
  graphCtx.beginPath();
  for (let i = 0; i < bestHistory.length; i++) {
    const x = padL + (i / (bestHistory.length - 1)) * gw;
    const y = padT + gh - (bestHistory[i].best / maxFit) * gh;
    i === 0 ? graphCtx.moveTo(x, y) : graphCtx.lineTo(x, y);
  }
  graphCtx.stroke();

  // Avg fitness line
  graphCtx.strokeStyle = 'rgba(100,200,255,0.6)';
  graphCtx.lineWidth = 1.5;
  graphCtx.beginPath();
  for (let i = 0; i < bestHistory.length; i++) {
    const x = padL + (i / (bestHistory.length - 1)) * gw;
    const y = padT + gh - (bestHistory[i].avg / maxFit) * gh;
    i === 0 ? graphCtx.moveTo(x, y) : graphCtx.lineTo(x, y);
  }
  graphCtx.stroke();

  // Labels
  graphCtx.fillStyle = '#e94560';
  graphCtx.font = '9px sans-serif';
  graphCtx.textAlign = 'left';
  graphCtx.fillText('Best', padL, padT - 1);
  graphCtx.fillStyle = 'rgba(100,200,255,0.8)';
  graphCtx.fillText('Avg', padL + 35, padT - 1);
  graphCtx.fillStyle = '#555';
  graphCtx.textAlign = 'right';
  graphCtx.fillText(`Gen ${bestHistory.length}`, w - padR, h - 2);
}

let animId = null;
function gameLoop() {
  for (let s = 0; s < speed; s++) {
    simStep();
  }
  render();
  updateStats();
  if (running) animId = requestAnimationFrame(gameLoop);
}

function start() {
  if (running) return;
  running = true;
  btnStart.textContent = 'Pause';
  btnStart.classList.remove('btn-primary');
  btnStart.classList.add('btn-active');
  gameLoop();
}

function pause() {
  running = false;
  btnStart.textContent = 'Resume';
  btnStart.classList.remove('btn-active');
  btnStart.classList.add('btn-primary');
  if (animId) cancelAnimationFrame(animId);
}

function resetAll() {
  pause();
  generation = 1;
  allTimeBest = 0;
  bestHistory = [];
  initPopulation();
  render();
  updateStats();
  drawGraph();
  btnStart.textContent = 'Start';
}

// Controls
const btnStart = document.getElementById('btnStart');
const btnSpeed = document.getElementById('btnSpeed');
const btnReset = document.getElementById('btnReset');

btnStart.addEventListener('click', () => running ? pause() : start());
btnSpeed.addEventListener('click', () => {
  const speeds = [1, 2, 5, 10];
  const labels = ['1x', '2x', '5x', '10x'];
  const idx = speeds.indexOf(speed);
  const next = (idx + 1) % speeds.length;
  speed = speeds[next];
  btnSpeed.textContent = `Speed: ${labels[next]}`;
});
btnReset.addEventListener('click', resetAll);

// Wait for images then init
function waitForImages() {
  const allImgs = [bgImg, lampImg, stoolImg, ...kittySprites];
  if (allImgs.every(img => img.complete)) {
    initPopulation();
    render();
    updateStats();
  } else {
    setTimeout(waitForImages, 200);
  }
}
waitForImages();
</script>
